# ===================================================================
# DATABASE CONFIGURATION (数据源配置)
# ===================================================================
# 请将 your_password 替换为您在MySQL中为root用户设置的真实密码
spring.datasource.url=jdbc:mysql://localhost:3306/ai_drawing_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=utf8&useUnicode=true&connectionCollation=utf8mb4_unicode_ci
spring.datasource.username=root
spring.datasource.password=DB_PASSWORD_PLACEHOLDER

# ===================================================================
# JPA / HIBERNATE CONFIGURATION (持久化框架配置)
# ===================================================================
# ddl-auto=update: Spring Boot启动时会自动比对实体类和数据库表结构，
# 如果不一致，会自动更新表结构（例如新增列），非常适合开发环境。
spring.jpa.hibernate.ddl-auto=update
# show-sql=true: 在后端控制台打印所有执行的SQL语句，便于调试。
spring.jpa.show-sql=true
# 数据库字符集配置
spring.jpa.properties.hibernate.connection.characterEncoding=utf-8
spring.jpa.properties.hibernate.connection.useUnicode=true

# ===================================================================
# APPLICATION-SPECIFIC CONFIGURATION (应用专属配置)
# ===================================================================
# ComfyUI服务器的API地址，ComfyUI运行在远程服务器，本地通过SSH端口转发ssh -p 33373 -L 12801:localhost:12801 root@qhdlink.lanyun.net到本地12801端口
comfyui.api.address=http://d2rso6kp420c73eqv8e0-12801.agent.damodel.com
# AI生成图片的本地存储路径，这里设置为项目根目录下的storage文件夹
file.storage.path=storage
# 文件上传大小限制（适用于分享时上传图片到画廊）
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# ===================================================================
# RABBITMQ CONFIGURATION (消息队列配置)
# ===================================================================
# 绘图任务队列的名称
rabbitmq.queue.name=drawing_task_queue
# RabbitMQ服务器的连接信息 (使用我们通过Docker启动的默认配置)
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ===================================================================
# REDIS CONFIGURATION (Redis缓存配置)
# ===================================================================
# Redis服务器的连接信息
spring.redis.host=localhost
spring.redis.port=6379
spring.redis.password=
spring.redis.database=0
# 连接池配置
spring.redis.lettuce.pool.max-active=20
spring.redis.lettuce.pool.max-wait=-1ms
spring.redis.lettuce.pool.max-idle=5
spring.redis.lettuce.pool.min-idle=0

# ===================================================================
# CACHE CONFIGURATION (缓存配置)
# ===================================================================
# 启用Spring Cache
spring.cache.type=redis
# 缓存名称配置
spring.cache.cache-names=galleryCache,drawingDetailsCache,hybridGalleryCache
# Redis缓存默认过期时间（单位：毫秒，这里设为10分钟）
spring.cache.redis.time-to-live=600000

# ===================================================================
# JACKSON JSON MAPPER CONFIGURATION (JSON转换器配置)
# ===================================================================
# 关键配置！
# 告诉Jackson将所有来自前端的snake_case（下划线命名）的JSON字段，
# 自动转换为Java后端习惯的camelCase（驼峰命名）属性。
# 恢复SNAKE_CASE配置，保持API一致性
spring.jackson.property-naming-strategy=SNAKE_CASE
# 支持Java 8时间类型的序列化
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.deserialization.adjust-dates-to-context-time-zone=false

# ===================================================================
# JWT CONFIGURATION (JWT配置)
# ===================================================================
# JWT密钥 - 生产环境应使用环境变量
app.jwt.secret=JWT_SECRET_PLACEHOLDER
# 访问Token过期时间（毫秒）- 1小时
app.jwt.access-token-expiration=3600000
# 刷新Token过期时间（毫秒）- 7天
app.jwt.refresh-token-expiration=604800000

